# ============================================================================== #
#                   AnarchySpawn - 简体中文语言文件 (zh_CN)                         #
# ============================================================================== #

prefix: "&#FF5555&l[&#FFAA00AnarchySpawn&#FF5555&l] &r"

spawn:
  # 聊天栏主要提示 (可使用占位符: {player}, {world}, {x}, {y}, {z}, {distance}, {biome}, {direction}, {seconds})
  first-join-chat: "&#55FF55欢迎加入游戏！你的出生点坐标: &#FFFF55X: {x} Y: {y} Z: {z} &#AAAAAA(群系: &f{biome} &#AAAAAA| 距离中心: &#55FF55{distance}&#AAAAAA格)"
  respawn-chat: "&#FFAA00你已在 &f{world} &#FFAA00安全重生，坐标: &#FFFF55X: {x} Y: {y} Z: {z} &#AAAAAA(群系: &f{biome} &#AAAAAA| 距离中心: &#55FF55{distance}&#AAAAAA格)"
  protection-started: "&#55FFFF已开启 {seconds} 秒出生保护时间。"
  protection-ended: "&#FF5555出生保护已结束，请注意安全。"

  # 玩家重生/出生时的详细位置卡片 (支持多行列表，若不需要可设置为空列表 [] 或注释)
  respawn-location-info:
    - "&6&l=========================================="
    - "&e  ▶ &6&l安全重生位置报告"
    - "&7  • 所在世界: &f{world}"
    - "&7  • 重生坐标: &#FFFF55X: {x} &7| &#FFFF55Y: {y} &7| &#FFFF55Z: {z}"
    - "&7  • 所处群系: &#55FFFF{biome} &7(朝向: &#FFFF55{direction}&7)"
    - "&7  • 距中心点: &#55FF55{distance} &7格"
    - "&7  • 无敌保护: &#55FFFF{seconds} &7秒"
    - "&6&l=========================================="

  first-join-location-info:
    - "&a&l=========================================="
    - "&e  ▶ &a&l新玩家出生位置报告"
    - "&7  • 所在世界: &f{world}"
    - "&7  • 出生坐标: &#FFFF55X: {x} &7| &#FFFF55Y: {y} &7| &#FFFF55Z: {z}"
    - "&7  • 所处群系: &#55FFFF{biome} &7(朝向: &#FFFF55{direction}&7)"
    - "&7  • 距中心点: &#55FF55{distance} &7格"
    - "&7  • 新人保护: &#55FFFF{seconds} &7秒"
    - "&a&l=========================================="

  # 备用点降级警告 (当随机安全点搜索超时/失败降级到 fallback-location 时提示，留空 "" 则不提示)
  fallback-warning: "&#FF5555警告: 未能找到合适的随机安全位置，已将你传送至世界备用重生点。"

  # 动作栏 ActionBar 提示 (优先匹配专属项，留空或不存在则回退至 actionbar)
  actionbar-first-join: "&#55FF55初次出生: &#FFFF55{x}, {y}, {z} &7({world} - {biome})"
  actionbar-respawn: "&#FFAA00重生位置: &#FFFF55{x}, {y}, {z} &7({world} - {biome} | 距离中心: &#55FF55{distance}&7格)"
  actionbar: "&#55FF55出生位置: &#FFFF55{x}, {y}, {z} &7({world})"

  # 全服广播 (留空 "" 则不进行全服广播)
  broadcast-first-join: ""
  broadcast-respawn: ""

  # 管理员重生监控提示 (发送给拥有 anarchyspawn.admin 权限的管理人员，留空 "" 则不开启)
  admin-notify-respawn: "&7[&#FFAA00重生监控&7] 玩家 &f{player} &7在 &f{world} &#FFFF55({x}, {y}, {z}) &7重生 (群系: &f{biome}&7)"

  # 服务端控制台日志提示 (在服务器后台输出的记录文本)
  server-log-first-join: "[初次出生] 玩家 {player} 在世界 {world} 初次出生，坐标: X:{x} Y:{y} Z:{z} (群系: {biome}, 距离中心: {distance}格)"
  server-log-respawn: "[安全重生] 玩家 {player} 在世界 {world} 安全重生，坐标: X:{x} Y:{y} Z:{z} (群系: {biome}, 距离中心: {distance}格)"

  # 屏幕中央 Title / Subtitle
  title-first-join: "&#FFAA00&l欢迎加入"
  subtitle-first-join: "&#AAAAAA世界: &f{world} &#AAAAAA| 坐标: &#FFFF55{x}, {z} &#AAAAAA| 群系: &#55FFFF{biome}"
  
  title-respawn: "&#FFAA00&l重生成功"
  subtitle-respawn: "&#AAAAAA世界: &f{world} &#AAAAAA| 坐标: &#FFFF55{x}, {z} &#AAAAAA| 群系: &#55FFFF{biome}"

command:
  no-permission: "&#FF5555你没有权限使用该命令。"
  player-only: "&#FF5555该命令只能由玩家在游戏内使用。"
  reload-success: "&#55FF55配置与多语言文件已重新加载 (已启用 &f{worlds_count}&#55FF55 个世界)。"
  player-not-found: "&#FF5555找不到玩家: &f{target}"
  world-not-found: "&#FF5555世界 &f{world} &#FF5555不存在或未启用随机出生。"
  setcenter-success: "&#55FF55已将世界 &f{world} &#55FF55的中心坐标设置为: &#FFFF55X: {x}, Z: {z}"
  usage-setcenter: "&#FF5555用法: &f/{label} setcenter <世界> <x> <z>"
  invalid-number: "&#FF5555错误: X 和 Z 坐标必须是有效数字。"
  tp-success: "&#55FF55已将玩家 &f{player} &#55FF55传送至: &#FFFF55X: {x} Y: {y} Z: {z} &7({world})"
  tp-searching: "&#AAAAAA正在寻找合适的位置..."
  tp-failed: "&#FF5555未找到合适位置，已传送至默认备用点。"
  
  test-header: "&#FFAA00========== [ AnarchySpawn 位置搜索测试 ] =========="
  test-searching: "&7正在测试世界 &f{world} &7的安全位置搜索..."
  test-result: "&#55FF55测试成功！耗时: &#FFFF55{time_ms}ms &#55FF55| 尝试: &#FFFF55{attempts}次 &#55FF55| 坐标: &#FFFF55{x}, {y}, {z} &#55FF55| 群系: &#FFFF55{biome}"
  test-failed: "&#FF5555测试失败！尝试 {attempts} 次后未找到合适位置。"
  
  info-header: "&#FFAA00========== [ AnarchySpawn 运行状态 ] =========="
  info-world: "&e- 世界 &f{world}&e: 状态: {status} | 初次传送: {first_join} | 范围: &f{min_radius}&e~&f{max_radius}格 &e| 预存位置: &a{pool_size}&e/&a{target_size}"
  info-cache-refreshed: "&#55FF55已重新填充所有启用的世界预存位置！"

  help-header: "&6====== &#FFAA00&lAnarchySpawn 帮助菜单 &6======"
  help-reload: "&e/{label} reload &7- 重载配置文件与提示文本"
  help-tp: "&e/{label} tp [玩家] [世界] &7- 将玩家随机传送至安全位置"
  help-setcenter: "&e/{label} setcenter <世界> <x> <z> &7- 设置随机出生的中心坐标"
  help-info: "&e/{label} info &7- 查看所有世界的配置与预存位置数量"
  help-test: "&e/{label} test [世界] &7- 测试坐标搜索速度与成功率"
  help-cache: "&e/{label} cache &7- 立即重新补充预存出生点"

